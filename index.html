<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunNarraY Demo</title>
  <script type="module" src="/src/main.ts" defer></script>
  <style>
    textarea {
      width: 500px;
      height: 450px;
    }

    #compile-button {
      padding: 10px;
      font-size: 1.5em;
    }

    #ast-graph {
      width: 1000px;
      height: 750px;
      border: solid black 2px;
    }

    #IR {
      background: #e6e6e6;
    }

    #dialogue-stack {
      max-width: 600px;
    }

    .dialogue-entry {
      margin: 16px 0;
    }

    .dialogue-text {
      white-space: pre-wrap;
    }

    .dialogue-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .dialogue-actions button.is-selected {
      background: #355a9d;
      color: white;
    }
  </style>
</head>

<body>
    <textarea id="demo-textarea" width="500" height="450"></textarea>
    <br>
    <button id="compile-button">Compile</button>
    <br>
    <div id="dialogue-stack" aria-live="polite"></div>
    <pre id="IR"></pre>
    <div id="ast-graph"></div>
    <pre id="debug"></pre>
</body>

</html>
